<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Floating hearts background -->
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- Main proposal container -->
    <div class="container" id="proposalContainer">
        <div class="proposal-card">
            <h1 class="title">
                <span class="heart-icon">♥</span>
                My Dearest Shweta
            </h1>
            <p class="question">Will you be my Valentine?</p>
            <div class="buttons-container">
                <button class="btn btn-yes" id="yesBtn">Yes! 💕</button>
                <button class="btn btn-no" id="noBtn">No</button>
            </div>
        </div>
    </div>

    <!-- Celebration overlay (hidden initially) -->
    <div class="celebration-overlay" id="celebrationOverlay">
        <div class="celebration-content">
            <h1 class="celebration-title">🎉 I Knew It! 🎉</h1>
            <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExN29vc2Y2ZXY1eHI2amxjbTdzeGZtYmx2dTBqZmJ2bzI4dTFiaTYwMCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ul1YXHSzBQQiFfkdH2/giphy.gif"
                alt="Celebration" class="celebration-gif">
            <p class="celebration-message">
                Of course you said YES! 😏<br>
                Because let's be honest... the "No" button never stood a chance! 😂<br><br>
                You're stuck with me now, Shweta! 💕<br>
                Happy Valentine's Day to my favorite person who can't say no! 😘<br><br>
                Love you to the moon and back! 🌙✨
            </p>
        </div>
        <!-- Falling roses -->
        <div class="roses-container" id="rosesContainer"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
