<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Floating hearts background -->
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- Main proposal container -->
    <div class="container" id="proposalContainer">
        <div class="proposal-card">
            <h1 class="title">
                <span class="heart-icon">♥</span>
                My Dearest Shweta
            </h1>
            <p class="question">Will you be my Valentine?</p>
            <div class="buttons-container">
                <button class="btn btn-yes" id="yesBtn">Yes! 💕</button>
                <button class="btn btn-no" id="noBtn">No</button>
            </div>
        </div>
    </div>

    <!-- Celebration overlay (hidden initially) -->
    <div class="celebration-overlay" id="celebrationOverlay">
        <div class="celebration-content">
            <h1 class="celebration-title">🌹 Yay! 🌹</h1>
            <p class="celebration-message">
                I knew you'd say yes, my love! ❤️<br><br>
                You make every day feel like Valentine's Day.<br>
                Thank you for being my forever Valentine, Shweta! 💕<br><br>
                I love you more than words can express! 🥰
            </p>
            <div class="heart-burst">❤️</div>
        </div>
        <!-- Falling roses -->
        <div class="roses-container" id="rosesContainer"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
